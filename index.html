<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>StainLab · 模型对比</title>
  <meta name="description" content="H&E 到 IHC 虚拟染色模型的 FID、KID、SSIM、PSNR、LPIPS 与 DISTS 对比。">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <div class="data-toolbar">
      <div class="data-switch" role="group" aria-label="实验数据组">
        <button data-group="mist-main" class="selected" aria-pressed="true">MIST主指标</button>
        <button data-group="ihc4bc-main" aria-pressed="false">IHC4BC主指标</button>
        <button data-group="tianjin-main" aria-pressed="false">Tianjin主指标</button>
        <button data-group="mist-extrapolation" aria-pressed="false">MIST真实外推</button>
        <button data-group="ihc4bc-extrapolation" aria-pressed="false">IHC4BC真实外推</button>
        <button data-group="tianjin-extrapolation" aria-pressed="false">Tianjin真实外推</button>
      </div>
      <span id="source-label">正在读取数据…</span>
      <div class="data-actions">
        <button class="text-button" id="reload-data">刷新</button>
        <button class="button" id="import-results">导入 CSV</button>
        <button class="button primary" id="export-results" disabled>导出结果</button>
      </div>
    </div>
    <section class="comparison-card" id="comparison">
      <div class="card-heading">
        <div class="heading-left">
          <div>
            <h2>模型对比</h2>
            <p id="comparison-description">查看各模型的指标</p>
          </div>
          <div class="stain-switch" role="group" aria-label="染色类型">
            <span>染色类型</span>
            <button data-stain="ER" class="selected" aria-pressed="true">ER</button>
            <button data-stain="PR" aria-pressed="false">PR</button>
            <button data-stain="HER2" aria-pressed="false">HER2</button>
            <button data-stain="KI67" aria-pressed="false">KI67</button>
          </div>
        </div>
        <div class="chart-controls">
          <div class="metric-tabs" role="group" aria-label="对比指标">
            <button data-metric="fid" class="selected" aria-pressed="true">FID ↓</button>
            <button data-metric="kid" aria-pressed="false">KID ↓</button>
            <button data-metric="ssim" aria-pressed="false">SSIM ↑</button>
            <button data-metric="psnr" aria-pressed="false">PSNR ↑</button>
            <button data-metric="lpips" aria-pressed="false">LPIPS ↓</button>
            <button data-metric="dists" aria-pressed="false">DISTS ↓</button>
          </div>
          <div class="chart-tabs" role="group" aria-label="图表类型">
            <button data-chart="line" aria-pressed="false">折线图</button>
            <button data-chart="bar" class="selected" aria-pressed="true">柱状图</button>
            <button data-chart="tile" aria-pressed="false">平铺图</button>
          </div>
        </div>
      </div>
      <span id="chart-hint" class="visually-hidden"></span>
      <div id="comparison-legend" class="legend" role="group" aria-label="显示或隐藏模型"></div>
      <div id="comparison-chart" class="comparison-chart" aria-live="polite"></div>
      <div id="chart-footnote" class="chart-footnote">同模型的多次结果取均值。悬停柱形查看数值。</div>
    </section>
    <section class="image-comparison" id="image-comparison" hidden>
      <div class="image-heading">
        <div>
          <h2>生成图像对比</h2>
          <p>同一样本的 H&amp;E、真实 IHC 与不同机型的生成结果 · 点击图片放大</p>
        </div>
        <div class="image-model" role="group" aria-label="图像对比模型">
          <span>模型</span>
          <button data-image-model="Baseline" class="selected" aria-pressed="true">Baseline</button>
          <button data-image-model="PGVMS" aria-pressed="false">PGVMS</button>
          <button data-image-model="USIGAN" aria-pressed="false">USIGAN</button>
        </div>
      </div>
      <div id="image-gallery"></div>
    </section>
  </main>
  <input type="file" id="results-file" accept=".csv,text/csv" hidden>
  <div id="chart-tooltip" class="chart-tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="image-dialog" class="image-dialog" aria-label="放大查看图像">
    <button type="button" class="image-dialog-close" aria-label="关闭放大图">×</button>
    <img alt="">
    <p></p>
  </dialog>
  <noscript><p class="noscript">请启用 JavaScript，以读取实验数据并展示模型对比图。</p></noscript>
</body>
</html>
