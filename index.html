<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>StainLab · 模型对比</title>
  <meta name="description" content="H&E 到 IHC 虚拟染色模型的 SSIM、PSNR 与 FID 对比。">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <div class="data-toolbar">
      <div class="data-switch" role="group" aria-label="数据来源">
        <button id="real-mode" class="selected" aria-pressed="true">实验数据</button>
        <button id="demo-mode" aria-pressed="false">演示数据</button>
      </div>
      <span id="source-label">正在读取 results.csv…</span>
      <div class="data-actions">
        <button class="text-button" id="reload-data">刷新</button>
        <button class="button" id="import-results">导入 CSV</button>
        <button class="button primary" id="export-results" disabled>导出结果</button>
      </div>
    </div>
    <section class="comparison-card" id="comparison">
      <div class="card-heading">
        <div>
          <h2>模型对比</h2>
          <p id="comparison-description">查看各模型的指标</p>
        </div>
        <div class="chart-controls">
          <div class="metric-tabs" role="group" aria-label="对比指标">
            <button data-metric="fid" class="selected" aria-pressed="true">FID ↓</button>
            <button data-metric="ssim" aria-pressed="false">SSIM ↑</button>
            <button data-metric="psnr" aria-pressed="false">PSNR ↑</button>
          </div>
          <div class="chart-tabs" role="group" aria-label="图表类型">
            <button data-chart="line" aria-pressed="false">折线图</button>
            <button data-chart="bar" class="selected" aria-pressed="true">柱状图</button>
            <button data-chart="tile" aria-pressed="false">平铺图</button>
          </div>
        </div>
      </div>
      <span id="chart-hint" class="visually-hidden"></span>
      <div id="comparison-legend" class="legend" role="group" aria-label="显示或隐藏模型"></div>
      <div id="comparison-chart" class="comparison-chart" aria-live="polite"></div>
      <div id="chart-footnote" class="chart-footnote">同模型的多次结果取均值。悬停柱形查看数值。</div>
    </section>
  </main>
  <input type="file" id="results-file" accept=".csv,text/csv" hidden>
  <div id="chart-tooltip" class="chart-tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">请启用 JavaScript，以读取实验数据并展示模型对比图。</p></noscript>
</body>
</html>
